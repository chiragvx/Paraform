name: Release (Windows desktop)

# Builds the signed, auto-updating Windows installer and publishes it to a
# GitHub Release. Triggered by a version tag (e.g. v0.1.0) or manually.
#
# The job ALWAYS rebuilds the PyInstaller kernel sidecar from the current source
# (the local src-tauri/binaries/*.exe is gitignored and must never be the
# shipped artifact — it would drift from the kernel code).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           updater signing key (npm run tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   VITE_SUPABASE_URL                   Supabase project URL (baked at build)
#   VITE_SUPABASE_PUBLISHABLE_KEY       Supabase anon/publishable key
#   # Windows code signing (W3) — fill in once a cert exists:
#   WINDOWS_CERTIFICATE                 base64 .pfx (or use Azure Trusted Signing)
#   WINDOWS_CERTIFICATE_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      - name: Install kernel deps (for the sidecar freeze)
        run: python -m pip install --upgrade pip && pip install -r b123d_server/requirements.txt

      - name: Build kernel sidecar (PyInstaller, ~5 min)
        run: npm run sidecar:build

      - name: Build + publish Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          # Updater artifact signing (W4).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked production frontend config — cloud-primary, mandatory auth.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_REQUIRE_AUTH: '1'
        with:
          # Sidecar already built above; tauri-action runs the rest of
          # beforeBuildCommand (sidecar:ensure is then a no-op + vite build).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
          releaseName: 'ParaForm ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install.'
          releaseDraft: true
          prerelease: false
