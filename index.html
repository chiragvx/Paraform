<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParaForm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // ── Kernel / AI-proxy endpoint ────────────────────────────────────────
      // The studio reaches the build123d kernel (b123d_server) at this base URL.
      // Resolution order (lib/document/kernel_client.js, provider.js, billing.js):
      //   1. VITE_ENGINE_URL   — build-time env. SET THIS in your Vercel project
      //                          to your kernel's stable HTTPS URL (an HF Space —
      //                          see b123d_server/DEPLOY_HUGGINGFACE.md).
      //   2. localhost page    → http://localhost:7823  (local `npm run kernel`).
      //   3. window global below — runtime override, if you can't set env.
      //
      // Prefer VITE_ENGINE_URL pointing at a STABLE kernel (HF Space — see
      // b123d_server/DEPLOY_HUGGINGFACE.md).
      //
      // TEMPORARY (refreshed 2026-06-19): cloudflared quick-tunnel to a LOCAL kernel.
      // This URL DIES when the tunnel or the local kernel stops — it is not a
      // permanent host. Swap it for the HF Space URL as soon as that's up. To
      // refresh after a restart: start a new tunnel and replace the URL below.
      //
      // DESKTOP GUARD: only inject this web fallback when NOT inside the Tauri
      // shell. The packaged desktop app talks to its bundled local sidecar
      // (127.0.0.1:7823 via lib/platform/runtime.js). Without this guard,
      // kernel_client.js would pick up this global BEFORE the desktop default
      // and mis-route the app to a dead/remote tunnel.
      if (!('__TAURI_INTERNALS__' in window)) {
        window.__PARAFORM_ENGINE_URL__ = 'https://defensive-avi-pipes-theory.trycloudflare.com';
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
